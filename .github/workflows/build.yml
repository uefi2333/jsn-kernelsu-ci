name: Build JSN SukiSU Ultra (Aggressive)

on:
  workflow_dispatch:
    inputs:
      ksu_flavor:
        description: "kernelsu | kernelsu-next | rksu | sukisu（空则用 config.env）"
        required: false
        default: ""
      ksu_hook:
        description: "builtin | manual | kprobe（空则用 config.env）"
        required: false
        default: ""
      do_release:
        description: "上传 GitHub Release"
        type: boolean
        default: true
  push:
    paths:
      - "config.env"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "anykernel/**"

concurrency:
  group: jsn-ksu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Kernel + SukiSU Ultra (Aggressive)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Load config.env
        id: cfg
        working-directory: builder
        run: |
          set -euo pipefail
          source ./config.env
          if [ -n "${{ github.event.inputs.ksu_flavor }}" ]; then
            KSU_FLAVOR="${{ github.event.inputs.ksu_flavor }}"
          fi
          if [ -n "${{ github.event.inputs.ksu_hook }}" ]; then
            KSU_HOOK="${{ github.event.inputs.ksu_hook }}"
          fi
          {
            echo "KERNEL_URL=$KERNEL_URL"
            echo "KERNEL_BRANCH=$KERNEL_BRANCH"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "ARCH=$ARCH"
            echo "KSU_FLAVOR=$KSU_FLAVOR"
            echo "KSU_VERSION=$KSU_VERSION"
            echo "KSU_HOOK=$KSU_HOOK"
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "ANDROID_VERSION=$ANDROID_VERSION"
            echo "LOCALVERSION=$LOCALVERSION"
            echo "SELINUX_MODE=$SELINUX_MODE"
            echo "JOBS=$JOBS"
            echo "SKIP_KSU_SETUP=$SKIP_KSU_SETUP"
            echo "STOCK_BOOT_URL=$STOCK_BOOT_URL"
            echo "RELEASE_PREFIX=$RELEASE_PREFIX"
            echo "USE_CCACHE=${USE_CCACHE:-0}"
            echo "ENABLE_SUSFS=${ENABLE_SUSFS:-false}"
            echo "ENABLE_KPM=${ENABLE_KPM:-false}"
          } >> "$GITHUB_ENV"
          echo "Config: $KSU_FLAVOR / hook=$KSU_HOOK / SUSFS=$ENABLE_SUSFS / KPM=$ENABLE_KPM"

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc             /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Install build deps
        run: |
          set -e
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential bc bison flex libssl-dev libelf-dev             dwarves openssl ccache python3 python3-pip git curl wget             zip unzip cpio xz-utils gcc-aarch64-linux-gnu g++-aarch64-linux-gnu             gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu             libncurses5-dev ca-certificates rsync device-tree-compiler             libc6-i386 lib32stdc++6 lib32z1 zlib1g:i386 ||           sudo apt-get install -y --no-install-recommends             build-essential bc bison flex libssl-dev libelf-dev             dwarves openssl ccache python3 git curl wget             zip unzip cpio xz-utils gcc-aarch64-linux-gnu             binutils-aarch64-linux-gnu libncurses5-dev ca-certificates rsync             device-tree-compiler libc6-i386 lib32stdc++6 lib32z1
          sudo ln -sf "$(which python3)" /usr/local/bin/python || true

      - name: Cache ccache
        if: env.USE_CCACHE == '1'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-jsn-${{ env.TOOLCHAIN }}-${{ env.DEFCONFIG }}-${{ hashFiles('builder/config.env') }}
          restore-keys: |
            ccache-jsn-${{ env.TOOLCHAIN }}-

      - name: Clone kernel source
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.GH_TOKEN || github.token }}"
          URL="$KERNEL_URL"
          if [[ "$URL" == https://github.com/* ]] && [ -n "$TOKEN" ]; then
            URL="https://x-access-token:${TOKEN}@${URL#https://}"
          fi
          echo "Cloning $KERNEL_URL @ $KERNEL_BRANCH ..."
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$URL" kernel ||           git clone --depth=1 "$URL" kernel
          cd kernel
          git checkout "$KERNEL_BRANCH" 2>/dev/null || true
          echo "Kernel HEAD: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

      - name: Setup toolchain
        run: |
          set -euo pipefail
          mkdir -p toolchains

          if [ "$TOOLCHAIN" = "gcc-4.9" ]; then
            try_clone() {
              local url="$1" dest="$2"
              echo "[*] try toolchain: $url"
              rm -rf "$dest"
              if git clone --depth=1 "$url" "$dest"; then
                if [ -x "$dest/bin/aarch64-linux-android-gcc" ] || [ -f "$dest/bin/aarch64-linux-android-gcc" ]; then
                  return 0
                fi
                local nested
                nested=$(find "$dest" -type f -name 'aarch64-linux-android-gcc' 2>/dev/null | head -n1 || true)
                if [ -n "$nested" ]; then
                  echo "$nested" > /tmp/gcc_bin_path.txt
                  return 0
                fi
                return 1
              fi
              return 1
            }

            DEST="toolchains/aarch64-linux-android-4.9"
            OK=0
            try_clone "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9" "$DEST" && OK=1 || true
            if [ "$OK" -eq 0 ]; then
              try_clone "https://github.com/growtopiajaw/aarch64-linux-android-4.9" "$DEST" && OK=1 || true
            fi
            if [ "$OK" -eq 0 ]; then
              try_clone "https://github.com/Adrilaw/aarch64-linux-android-4.9-toolchain" "$DEST" && OK=1 || true
            fi
            if [ "$OK" -eq 0 ]; then
              try_clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9" "$DEST" && OK=1 || true
            fi

            GCC_BIN=""
            if [ -f /tmp/gcc_bin_path.txt ]; then
              GCC_BIN=$(dirname "$(cat /tmp/gcc_bin_path.txt)")
            elif [ -x "$DEST/bin/aarch64-linux-android-gcc" ]; then
              GCC_BIN="$GITHUB_WORKSPACE/$DEST/bin"
            else
              found=$(find toolchains -type f -name 'aarch64-linux-android-gcc' 2>/dev/null | head -n1 || true)
              [ -n "$found" ] && GCC_BIN=$(dirname "$found")
            fi

            if [ -z "$GCC_BIN" ] || [ ! -f "$GCC_BIN/aarch64-linux-android-gcc" ]; then
              echo "[-] 找不到 aarch64-linux-android-gcc"
              exit 1
            fi

            chmod +x "$GCC_BIN"/aarch64-linux-android-* || true
            if ! "$GCC_BIN/aarch64-linux-android-gcc" --version; then
              sudo apt-get install -y libc6-i386 lib32stdc++6 lib32z1 || true
              "$GCC_BIN/aarch64-linux-android-gcc" --version
            fi

            echo "PATH=$GCC_BIN:$PATH" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE=$GCC_BIN/aarch64-linux-android-" >> "$GITHUB_ENV"
            echo "HOSTCC=gcc" >> "$GITHUB_ENV"
            echo "HOSTCXX=g++" >> "$GITHUB_ENV"
            ln -sfn "$(dirname "$GCC_BIN")" kernel/aarch64-linux-android-4.9 || true
            echo "[+] toolchain ok: $GCC_BIN"
          else
            mkdir -p toolchains/clang
            wget -q -O /tmp/clang.tar.gz               "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${CLANG_VERSION}.tar.gz"               || wget -q -O /tmp/clang.tar.gz               "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/archive/refs/heads/lineage-20.0.tar.gz"
            tar -xzf /tmp/clang.tar.gz -C toolchains/clang --strip-components=0 2>/dev/null ||               tar -xzf /tmp/clang.tar.gz -C toolchains/clang
            CLANG_BIN=$(find toolchains/clang -type f -name clang | head -n1 | xargs dirname)
            echo "PATH=$CLANG_BIN:$PATH" >> "$GITHUB_ENV"
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          fi

          if [ "${USE_CCACHE:-0}" = "1" ]; then
            export CCACHE_DIR=~/.ccache
            ccache -M 5G || true
          fi

      - name: Integrate SukiSU-Ultra (builtin)
        run: |
          set -euo pipefail
          bash builder/scripts/integrate_ksu.sh

      - name: Patch SukiSU for Linux 4.9
        run: |
          set -euo pipefail
          bash builder/scripts/patch_sukisu_4.9.sh

      - name: Apply SUSFS v2.0.0 + KPM backport patch
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -euo pipefail
          bash builder/scripts/apply_susfs.sh

      - name: Build kernel
        run: |
          set -euo pipefail
          bash builder/scripts/build_kernel.sh

      - name: Apply KPM patch to kernel Image
        if: env.ENABLE_KPM == 'true'
        run: |
          set -euo pipefail
          bash builder/scripts/patch_kpm.sh

      - name: Pack AnyKernel3
        run: |
          set -euo pipefail
          bash builder/scripts/pack_anykernel.sh

      - name: Optional repack boot.img
        if: env.STOCK_BOOT_URL != ''
        run: |
          set -euo pipefail
          mkdir -p out
          wget -q -O out/stock-boot.img "$STOCK_BOOT_URL"
          wget -q -O /tmp/magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -p /tmp/magisk.apk lib/linux-x86/libmagiskboot.so > out/magiskboot ||           unzip -p /tmp/magisk.apk lib/x86_64/libmagiskboot.so > out/magiskboot
          chmod +x out/magiskboot
          cd out
          ./magiskboot unpack stock-boot.img
          KERNEL_IMG=""
          for c in ../kernel/out/arch/arm64/boot/Image.gz-dtb                    ../kernel/arch/arm64/boot/Image.gz-dtb                    ../kernel/out/arch/arm64/boot/Image.gz                    ../kernel/arch/arm64/boot/Image.gz                    ../kernel/out/arch/arm64/boot/Image                    ../kernel/arch/arm64/boot/Image; do
            if [ -f "$c" ]; then KERNEL_IMG="$c"; break; fi
          done
          test -n "$KERNEL_IMG"
          cp -f "$KERNEL_IMG" kernel
          ./magiskboot repack stock-boot.img boot-repacked.img

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p upload
          find kernel -type f \( -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' -o -name 'Image-dtb' \)             -path '*/arch/arm64/boot/*' -print0 | while IFS= read -r -d '' f; do
              cp -v "$f" upload/
            done
          if [ -f out/kernel.img ]; then
            cp -v out/kernel.img upload/kernel.img
          elif [ -f out/release/kernel.img ]; then
            cp -v out/release/kernel.img upload/kernel.img
          else
            for c in kernel/out/arch/arm64/boot/Image kernel/arch/arm64/boot/Image                      kernel/out/arch/arm64/boot/Image.gz kernel/arch/arm64/boot/Image.gz; do
              if [ -f "$c" ]; then cp -v "$c" upload/kernel.img; break; fi
            done
          fi
          test -f upload/kernel.img
          cp -v out/AnyKernel3-*.zip upload/ 2>/dev/null || true
          cp -v out/boot-repacked.img upload/ 2>/dev/null || true
          {
            echo "device=JSN"
            echo "board=EMUI9.1"
            echo "flavor=$KSU_FLAVOR"
            echo "version=$KSU_VERSION"
            echo "hook=$KSU_HOOK"
            echo "susfs=$ENABLE_SUSFS"
            echo "kpm=$ENABLE_KPM"
            echo "defconfig=$DEFCONFIG"
            echo "localversion=$LOCALVERSION"
            echo "sha=$(cd kernel && git rev-parse --short HEAD 2>/dev/null || echo na)"
            echo "date=$(date -u +%Y%m%d-%H%M%S)"
          } | tee upload/build-info.txt
          ls -lah upload
          test -f upload/kernel.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSN-Aggressive-${{ github.run_number }}
          path: upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (kernel.img)
        if: ${{ github.event_name == 'push' || github.event.inputs.do_release == 'true' || github.event.inputs.do_release == true || github.event.inputs.do_release == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_PREFIX }}-${{ github.run_number }}
          name: ${{ env.RELEASE_PREFIX }}
          body: |
            JSN (Honor 8X / Kirin 710) **EMUI 9.1** Aggressive Build
            - Flavor: `${{ env.KSU_FLAVOR }}` (builtin mode)
            - SUSFS: `${{ env.ENABLE_SUSFS }}` (v2.0.0 inline hooks)
            - KPM: `${{ env.ENABLE_KPM }}` (Kernel Patch Module)
            - Defconfig: `${{ env.DEFCONFIG }}`
            - 刷机命令: `fastboot flash kernel kernel.img`
            **刷机前备份原 kernel，错底包/未解锁会无法开机。**
          files: |
            upload/kernel.img
            upload/*
          token: ${{ secrets.GH_TOKEN || github.token }}
          generate_release_notes: false
          fail_on_unmatched_files: false
