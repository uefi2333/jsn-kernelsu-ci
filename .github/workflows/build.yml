name: Build JSN KernelSU

on:
  workflow_dispatch:
    inputs:
      ksu_flavor:
        description: "kernelsu | kernelsu-next | rksu（空则用 config.env）"
        required: false
        default: ""
      ksu_hook:
        description: "manual | kprobe（空则用 config.env）"
        required: false
        default: ""
      do_release:
        description: "上传 GitHub Release"
        type: boolean
        default: false
  push:
    paths:
      - "config.env"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "anykernel/**"

concurrency:
  group: jsn-ksu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Kernel + KernelSU
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Load config.env
        id: cfg
        working-directory: builder
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./config.env
          if [ -n "${{ github.event.inputs.ksu_flavor }}" ]; then
            KSU_FLAVOR="${{ github.event.inputs.ksu_flavor }}"
          fi
          if [ -n "${{ github.event.inputs.ksu_hook }}" ]; then
            KSU_HOOK="${{ github.event.inputs.ksu_hook }}"
          fi
          {
            echo "KERNEL_URL=$KERNEL_URL"
            echo "KERNEL_BRANCH=$KERNEL_BRANCH"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "ARCH=$ARCH"
            echo "KSU_FLAVOR=$KSU_FLAVOR"
            echo "KSU_VERSION=$KSU_VERSION"
            echo "KSU_HOOK=$KSU_HOOK"
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "ANDROID_VERSION=$ANDROID_VERSION"
            echo "LOCALVERSION=$LOCALVERSION"
            echo "SELINUX_MODE=$SELINUX_MODE"
            echo "JOBS=$JOBS"
            echo "SKIP_KSU_SETUP=$SKIP_KSU_SETUP"
            echo "STOCK_BOOT_URL=$STOCK_BOOT_URL"
            echo "RELEASE_PREFIX=$RELEASE_PREFIX"
          } >> "$GITHUB_ENV"
          echo "Config loaded: $KSU_FLAVOR / $KSU_HOOK / $DEFCONFIG"

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          df -h

      - name: Install build deps
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            dwarves openssl ccache python3 python3-pip git curl wget \
            zip unzip cpio xz-utils gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libncurses5-dev ca-certificates rsync device-tree-compiler
          # 老内核常要 python2 的某些脚本；22.04 无 python2，做个兼容软链兜底
          sudo ln -sf "$(which python3)" /usr/local/bin/python || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-jsn-${{ env.TOOLCHAIN }}-${{ env.DEFCONFIG }}-${{ hashFiles('builder/config.env') }}
          restore-keys: |
            ccache-jsn-${{ env.TOOLCHAIN }}-

      - name: Clone kernel source
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.GH_TOKEN || github.token }}"
          # 支持 https 私有仓
          URL="$KERNEL_URL"
          if [[ "$URL" == https://github.com/* ]] && [ -n "$TOKEN" ]; then
            URL="https://x-access-token:${TOKEN}@${URL#https://}"
          fi
          echo "Cloning $KERNEL_URL @ $KERNEL_BRANCH ..."
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$URL" kernel || \
          git clone --depth=1 "$URL" kernel
          cd kernel
          git checkout "$KERNEL_BRANCH" 2>/dev/null || true
          echo "Kernel HEAD: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          ls arch/arm64/configs | head -n 50 || true

      - name: Setup toolchain
        run: |
          set -euo pipefail
          mkdir -p toolchains
          if [ "$TOOLCHAIN" = "gcc-4.9" ]; then
            # AOSP GCC 4.9（华为 4.9 内核常用）
            if [ ! -d toolchains/aarch64-linux-android-4.9 ]; then
              git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchains/aarch64-linux-android-4.9 \
                || git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchains/aarch64-linux-android-4.9
            fi
            echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
            echo "CC=gcc" >> "$GITHUB_ENV"
          else
            # AOSP clang
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-${CLANG_VERSION}.tar.gz"
            mkdir -p toolchains/clang
            wget -q -O /tmp/clang.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${CLANG_VERSION}.tar.gz" \
              || wget -q -O /tmp/clang.tar.gz \
              "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/archive/refs/heads/lineage-20.0.tar.gz"
            tar -xzf /tmp/clang.tar.gz -C toolchains/clang --strip-components=0 2>/dev/null || \
              tar -xzf /tmp/clang.tar.gz -C toolchains/clang
            CLANG_BIN=$(find toolchains/clang -type f -name clang | head -n1 | xargs dirname)
            echo "PATH=$CLANG_BIN:$PATH" >> "$GITHUB_ENV"
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          fi
          export CCACHE_DIR=~/.ccache
          export USE_CCACHE=1
          ccache -M 5G || true

      - name: Integrate KernelSU
        run: |
          set -euo pipefail
          bash builder/scripts/integrate_ksu.sh

      - name: Apply manual hooks & path_umount
        if: env.KSU_HOOK == 'manual'
        run: |
          set -euo pipefail
          python3 builder/scripts/apply_manual_hooks.py kernel
          bash builder/scripts/patch_defconfig.sh

      - name: Patch defconfig (kprobe path)
        if: env.KSU_HOOK == 'kprobe'
        run: |
          set -euo pipefail
          bash builder/scripts/patch_defconfig.sh

      - name: Build kernel
        run: |
          set -euo pipefail
          bash builder/scripts/build_kernel.sh

      - name: Pack AnyKernel3
        run: |
          set -euo pipefail
          bash builder/scripts/pack_anykernel.sh

      - name: Optional repack boot.img
        if: env.STOCK_BOOT_URL != ''
        run: |
          set -euo pipefail
          mkdir -p out
          wget -q -O out/stock-boot.img "$STOCK_BOOT_URL"
          wget -q -O /tmp/magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -p /tmp/magisk.apk lib/linux-x86/libmagiskboot.so > out/magiskboot || \
          unzip -p /tmp/magisk.apk lib/x86_64/libmagiskboot.so > out/magiskboot
          chmod +x out/magiskboot
          cd out
          ./magiskboot unpack stock-boot.img
          KERNEL_IMG=""
          for c in ../kernel/out/arch/arm64/boot/Image.gz-dtb \
                   ../kernel/arch/arm64/boot/Image.gz-dtb \
                   ../kernel/out/arch/arm64/boot/Image.gz \
                   ../kernel/arch/arm64/boot/Image.gz \
                   ../kernel/out/arch/arm64/boot/Image \
                   ../kernel/arch/arm64/boot/Image; do
            if [ -f "$c" ]; then KERNEL_IMG="$c"; break; fi
          done
          test -n "$KERNEL_IMG"
          cp -f "$KERNEL_IMG" kernel
          ./magiskboot repack stock-boot.img boot-repacked.img
          ls -lh boot-repacked.img

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p upload
          # 找镜像
          find kernel -type f \( -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' -o -name 'Image-dtb' \) \
            -path '*/arch/arm64/boot/*' -print0 | while IFS= read -r -d '' f; do
              cp -v "$f" upload/
            done
          cp -v out/AnyKernel3-*.zip upload/ 2>/dev/null || true
          cp -v out/boot-repacked.img upload/ 2>/dev/null || true
          # 构建信息
          {
            echo "device=JSN"
            echo "flavor=$KSU_FLAVOR"
            echo "version=$KSU_VERSION"
            echo "hook=$KSU_HOOK"
            echo "defconfig=$DEFCONFIG"
            echo "localversion=$LOCALVERSION"
            echo "sha=$(cd kernel && git rev-parse --short HEAD 2>/dev/null || echo na)"
            echo "date=$(date -u +%Y%m%d-%H%M%S)"
          } | tee upload/build-info.txt
          ls -lah upload
          test "$(find upload -type f | wc -l)" -gt 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSN-KernelSU-${{ env.KSU_FLAVOR }}-${{ github.run_number }}
          path: upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        if: ${{ github.event.inputs.do_release == 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.do_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_PREFIX }}-${{ env.KSU_FLAVOR }}-${{ github.run_number }}
          name: ${{ env.RELEASE_PREFIX }} ${{ env.KSU_FLAVOR }} #${{ github.run_number }}
          body: |
            JSN (Honor 8X / Kirin 710) KernelSU auto build
            - Flavor: `${{ env.KSU_FLAVOR }}` `${{ env.KSU_VERSION }}`
            - Hook: `${{ env.KSU_HOOK }}`
            - Defconfig: `${{ env.DEFCONFIG }}`
            - Localversion: `${{ env.LOCALVERSION }}`
            **刷机前备份，错底包会无法开机。**
          files: upload/*
          token: ${{ secrets.GH_TOKEN || github.token }}
          generate_release_notes: false
